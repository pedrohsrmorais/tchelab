# TcheLab — stack completo (mysql + redis + backend_api/frontend + worker
# Python) num compose só.
#
# Por quê isto existe: o bug que motivou essa refatoração (job preso em
# "queued" para sempre) nasceu de backend_api e worker_api lendo config de
# Redis/host de dois `.env` separados, sob pm2, sem nada garantindo que os
# dois concordassem — e de processos "zumbi" sobrando de restarts manuais.
# Aqui, host/porta/DB do Redis e do MySQL para os dois serviços vêm do MESMO
# bloco YAML (ancoras `x-queue-env`/`x-mysql-env` abaixo, mescladas nos dois
# serviços) — não tem como divergir silenciosamente. E cada `docker compose
# up --build` sobe containers novos a partir da imagem recém-buildada; não
# sobra processo solto de teste manual disputando a fila.
#
# Uso:
#   cp .env.example .env        # preencha as senhas/segredos reais
#   docker compose up -d --build
#   docker compose logs -f backend worker   # acompanhar
#
# tchelab.intellsn.com.br já aponta para a porta 3003 do host — o serviço
# `backend` publica exatamente nela, então nada muda do lado do proxy/DNS.

x-queue-env: &queue-env
  JOB_QUEUE: tchelab_fila
  RESULT_CHANNEL: tchelab_resultados
  JOB_TIMEOUT_SECONDS: "300"

x-mysql-env: &mysql-env
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_USER: ${DB_USER}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_NAME: ${DB_NAME}

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      # docker-entrypoint-initdb.d só roda na 1ª subida (volume vazio) — é
      # assim que "recriar o banco do zero" acontece: apague o volume
      # mysql_data (`docker compose down -v`) e suba de novo.
      # init.mysql é o único arquivo necessário — já inclui schema, seed
      # base, sincronização do catálogo (169 scripts) e a lista beta de
      # técnicas ativas, tudo consolidado (ver backend_api/sql/CATALOG_AUDIT.md).
      - ./backend_api/src/config/init.mysql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [tchelab]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [tchelab]

  # MinIO: armazenamento de objetos compatível com S3 (arquivos dos usuários). Fica só na rede interna;
  # o console (porta 9001) não é publicado — acesse por túnel SSH ou publique atrás de autenticação.
  # Para migrar para a AWS: STORAGE_DRIVER=s3, S3_ENDPOINT vazio, S3_FORCE_PATH_STYLE=false e as chaves da AWS no .env.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks: [tchelab]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        # a imagem do MinIO não traz curl/mc para healthcheck; o backend tenta de novo ao iniciar (storage.init)
        condition: service_started
    environment:
      <<: [*mysql-env, *queue-env]
      PORT: "3003"
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "1"
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Opcionais — lidos com fallback pelo próprio backend (auth.controller.js)
      # se não vierem definidos, então não são obrigatórios no .env.
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      STORAGE_PATH: /app/storage
      # Arquivos dos usuários: MinIO (S3). `local` volta a gravar em STORAGE_PATH (só desenvolvimento).
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-tchelab}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      # Capacidade provisionada para o armazenamento (bytes). Usada no painel "cota alocada × capacidade".
      S3_CAPACITY_BYTES: ${S3_CAPACITY_BYTES:-0}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-TcheLab <onboarding@resend.dev>}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - storage_data:/app/storage
    ports:
      - "3003:3003"
    networks: [tchelab]

  worker:
    build:
      context: .
      dockerfile: worker_api/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      <<: [*queue-env]
      REDIS_URL: redis://redis:6379/1
      WORKER_CONCURRENCY: "4"
      POLL_INTERVAL_SECONDS: "0.5"
      LOG_LEVEL: INFO
    networks: [tchelab]

volumes:
  mysql_data:
  redis_data:
  storage_data:
  minio_data:

networks:
  tchelab:
    driver: bridge

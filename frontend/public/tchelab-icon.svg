<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3a8a" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Flask body -->
  <path d="M38 22 L38 48 L22 72 Q19 78 25 80 L75 80 Q81 78 78 72 L62 48 L62 22 Z"
        fill="url(#glow)" opacity="0.15" stroke="#93c5fd" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Flask neck -->
  <rect x="36" y="20" width="28" height="8" rx="3" fill="#60a5fa" opacity="0.5"/>
  <rect x="38" y="20" width="24" height="6" rx="2" fill="#93c5fd" opacity="0.7"/>

  <!-- Flask lines (body outline) -->
  <path d="M40 28 L40 50 L24 74 Q22 78 27 79 L73 79 Q78 78 76 74 L60 50 L60 28"
        stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Liquid inside flask -->
  <path d="M28 66 Q35 60 50 63 Q65 66 72 60 L76 74 Q78 78 73 79 L27 79 Q22 78 24 74 Z"
        fill="#2563eb" opacity="0.8"/>
  <path d="M28 66 Q35 60 50 63 Q65 66 72 60"
        stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.9"/>

  <!-- Bubbles -->
  <circle cx="38" cy="70" r="2.5" fill="#93c5fd" opacity="0.8"/>
  <circle cx="52" cy="68" r="1.8" fill="#bfdbfe" opacity="0.7"/>
  <circle cx="63" cy="72" r="2" fill="#60a5fa" opacity="0.6"/>

  <!-- Spectral lines (NIR/chemometrics motif) -->
  <line x1="25" y1="44" x2="30" y2="44" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <line x1="25" y1="48" x2="32" y2="48" stroke="#93c5fd" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
  <line x1="25" y1="52" x2="29" y2="52" stroke="#60a5fa" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

  <!-- Stars / sparkles -->
  <circle cx="76" cy="24" r="2" fill="#93c5fd" opacity="0.8"/>
  <circle cx="84" cy="32" r="1.2" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="20" cy="30" r="1.5" fill="#60a5fa" opacity="0.5"/>
</svg>
